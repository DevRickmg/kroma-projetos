<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Kroma Projetos">
  <defs>
    <linearGradient id="kromaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="55%" stop-color="#7B5CFF"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <filter id="kromaGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#kromaGlow)" fill="none" stroke="url(#kromaGrad)" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round">
    <polygon points="120,30 197.94,75 197.94,165 120,210 42.06,165 42.06,75" stroke-width="5"/>
    <path d="M120,30 L120,210 M197.94,75 L42.06,165 M42.06,75 L197.94,165"/>
    <path d="M120,30 L197.94,165 M197.94,75 L120,210 M197.94,165 L42.06,165
             M120,210 L42.06,75 M42.06,165 L120,30 M42.06,75 L197.94,75" opacity="0.85"/>
  </g>
</svg>
