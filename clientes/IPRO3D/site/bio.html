<style>
:root{
  --indigo:#2a2472;
  --indigo-600:#3b34a0;
  --indigo-700:#201a5c;
  --indigo-900:#14103c;
  --indigo-50:#eceafb;
  --indigo-100:#ded9f7;
  --orange:#f5851f;
  --orange-600:#e0740f;
  --line:#e2ddf6;
  --muted:#6b6690;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(60% 50% at 15% 0%, #f7e9d8 0%, transparent 60%),
    radial-gradient(55% 45% at 100% 100%, var(--indigo-100) 0%, transparent 60%),
    var(--indigo-50);
  color:var(--indigo-900);
  display:flex;
  justify-content:center;
  padding:clamp(2rem,6vw,3.5rem) 1.1rem 2.5rem;
}
.wrap{width:100%;max-width:410px;display:flex;flex-direction:column;align-items:center;text-align:center}

.brand{display:flex;flex-direction:column;align-items:center;gap:.7rem;text-decoration:none;margin-bottom:.4rem}
.brand-mark{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 26px -12px rgba(20,16,60,.35)}

.tag{font-size:.92rem;color:var(--muted);font-weight:500;margin:.6rem 0 1.9rem;line-height:1.5}

.links{width:100%;display:flex;flex-direction:column;gap:.85rem}

.btn{
  font-family:"Plus Jakarta Sans",sans-serif;
  font-weight:700;
  font-size:.98rem;
  letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;gap:.55rem;
  width:100%;
  padding:1.05rem 1.3rem;
  border-radius:16px;
  text-decoration:none;
  border:1.5px solid transparent;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease, color .18s ease;
}
.btn:active{transform:scale(.96)}
@media (hover:hover){
  .btn:hover{transform:scale(1.025)}
}
.btn svg{flex:none}

.btn-orange{background:var(--orange);color:#fff;box-shadow:0 10px 26px -10px rgba(245,133,31,.55)}
.btn-orange:hover{background:var(--orange-600);box-shadow:0 14px 30px -10px rgba(245,133,31,.65)}

.btn-dark{background:var(--indigo-900);color:#fff}
.btn-dark:hover{background:var(--indigo-700)}

.btn-line{background:transparent;border-color:var(--indigo-900);color:var(--indigo-900)}
.btn-line:hover{background:var(--indigo-900);color:#fff}

@keyframes pulse{
  0%,100%{box-shadow:0 10px 26px -10px rgba(245,133,31,.55)}
  50%{box-shadow:0 10px 30px -6px rgba(245,133,31,.85)}
}
.pulse{animation:pulse 2.2s ease-in-out infinite}

/* entrada em cascata */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.rv{opacity:0;animation:fadeUp .65s cubic-bezier(.16,1,.3,1) forwards}
.brand.rv{animation-delay:.05s}
.tag.rv{animation-delay:.16s}
.links a.rv:nth-child(1){animation-delay:.27s}
.links a.rv:nth-child(2){animation-delay:.35s}
.links a.rv:nth-child(3){animation-delay:.43s}
.links a.rv:nth-child(4){animation-delay:.51s}
.links a.rv:nth-child(5){animation-delay:.59s}
.socials.rv{animation-delay:.7s}
.foot.rv{animation-delay:.78s}

/* botão de agendar: entra em cascata igual aos outros, depois passa a respirar */
.links a.pulse.rv{
  animation-name:fadeUp,pulse;
  animation-duration:.65s,2.2s;
  animation-timing-function:cubic-bezier(.16,1,.3,1),ease-in-out;
  animation-delay:.27s,1.3s;
  animation-iteration-count:1,infinite;
  animation-fill-mode:forwards,none;
}

@media (prefers-reduced-motion:reduce){
  .pulse, .rv, .links a.pulse.rv{animation:none}
  .rv{opacity:1}
}

.socials{margin-top:2.3rem;display:flex;align-items:center;gap:1.1rem}
.socials a{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--muted);
  background:#fff;
  border:1px solid var(--line);
  transition:color .2s ease, border-color .2s ease, transform .2s ease;
}
.socials a:hover{color:var(--orange);border-color:var(--orange);transform:translateY(-2px)}

.foot{margin-top:1.6rem;font-size:.74rem;color:var(--muted)}
</style>
</head>
